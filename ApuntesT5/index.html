<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios JavaScript Resueltos</title>
</head>
<body>

    <h1 id="titulo">Ejercicios JavaScript</h1>

    <!-- LOGIN -->
    <h2>Login</h2>
    <input type="text" id="usuario" placeholder="Usuario">
    <input type="password" id="clave" placeholder="Contraseña">
    <button id="login">Entrar</button>
    <p id="resultadoLogin"></p>

    <hr>

    <!-- CAMBIAR TEXTO -->
    <h2>Cambiar Texto</h2>
    <button id="botonTexto">Cambiar título</button>

    <hr>

    <!-- CAMBIAR COLOR -->
    <h2>Cambiar Color</h2>
    <div id="botonesColores"></div>

    <hr>

    <!-- PRESENTACIÓN -->
    <h2>Presentación</h2>
    <input type="text" id="nombre">
    <input type="number" id="edad">
    <button id="mostrar">Mostrar</button>
    <p id="resultado"></p>

    <hr>

    <!-- LISTA DINÁMICA -->
    <h2>Lista dinámica</h2>
    <input type="text" id="texto">
    <button id="añadir">Añadir</button>
    <ul id="lista"></ul>

    <script src="script.js"></script>

</body>
</html>
