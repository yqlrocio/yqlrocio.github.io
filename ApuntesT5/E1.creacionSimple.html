<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1: Serialización y Deserialización</title>
</head>
<body>
    <h2>Ejercicio 1 - Creación Simple</h2>
    <div id="serializado"></div>
    <div id="deserializado"></div>

    <script>
        // Objeto JS inicial
        let obj = {
            nombre: "Alberto",
            apellidos: "García",
            edad: 26,
            ciudad: "Granada"
        };

        // Funciones de serialización y deserialización
        function serializar(objeto) {
            return JSON.stringify(objeto);
        }

        function deserializar(textoJson) {
            return JSON.parse(textoJson);
        }

        // Ejecutar acciones
        let json_serializado = serializar(obj);
        console.log("JSON Enviado (Serializado):", json_serializado);

        let obj_recuperado = deserializar(json_serializado);
        console.log("Objeto Recuperado:", obj_recuperado);

        // Mostrar en la interfaz (opcional)
        document.getElementById("serializado").innerText = "Serializado: " + json_serializado;
        
        let texto = "Nombre: " + obj_recuperado.nombre + 
                    ", Apellidos: " + obj_recuperado.apellidos + 
                    ", Edad: " + obj_recuperado.edad + 
                    ", Ciudad: " + obj_recuperado.ciudad;
        
        document.getElementById("deserializado").innerText = "Recuperado: " + texto;
    </script>
</body>
</html>
