    <h1>Ejercicio 1: Infiltración en el Servidor de la Sociedad Secreta</h1>
    <h2>Qiaolin Rocío Ye</h2>


    <!-- En primer lugar creamos un botón "Instrucciones", en el que el usuario deberá de pulsar al inicio y se le mostrará las instrucciones -->
    <form id="informacion">
        <button type="button" id="instruccion">Instrucciones</button>
    </form>

     <pre id="resultado"></pre>

    <script>
        $("#instruccion").click(async function() {
            // Objeto de prueba
            let dataToSend = [{
                nom_alum: "Rocio",
                num_ejer: "1",
                password: "1q2w3e",
                llave: ""
            }];

            try {
                let respuesta = await $.ajax({
                    url: "http://192.168.100.150/api/secret",
                    method: "GET",
                    data: JSON.stringify(dataToSend),
                    contentType: "/api/secret",
                    dataType: "json"
                });

                console.log("Respuesta del servidor:", respuesta);
                $("#resultado").text(JSON.stringify(respuesta, null, 2));
            } catch (error) {
                console.error("Error en el envío:", error);
                $("#resultado").text("Error de conexión con el servidor.");
            }
  
        });
    </script>
