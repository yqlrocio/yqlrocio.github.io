<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Exercises</title>
</head> 

<body>
    <h1>Ejercicio 1: Botón Aleatorio y Selector de Perros</h1>
    <button id="botonRambon">Mostrar Perro Aleatorio</button>
    <select id="boton">
        <option value="">Selecciona una raza</option>
    </select>
    <img id="imagen" src="" alt="Imagen de perro" style="display:none; width:300px; margin-top:20px;">
    
    <script>
        const randomButton = document.getElementById('botonRambon');
        const boton = document.getElementById('boton');
        const imagen = document.getElementById('imagen');

        // Función para mostrar un perro aleatorio
        randomButton.addEventListener('click', () => {
            fetch('https://dog.ceo/api/breeds/image/random')
                .then(respuesta => respuesta.json())
                .then(perro => {
                    imagen.src = perro.message;
                    imagen.style.display = 'block';
                })
        });

        // Función para cargar las razas de perros en el selector
        fetch('https://dog.ceo/api/breeds/list/all')
            .then(respuesta => respuesta.json())
            .then(perro => {
                const breeds = perro.message;
                for (const breed in breeds) {
                    if (breeds[breed].length === 0) {
                        // Raza sin subrazas
                        const opcion = document.createElement('option');
                        opcion.value = `https://dog.ceo/api/breed/${breed}/images/random`;
                        opcion.textContent = breed;
                        boton.appendChild(opcion);
                    } else {
                        // Raza con subrazas
                        breeds[breed].forEach(subBreed => {
                            const opcion = document.createElement('option');
                            opcion.value = `https://dog.ceo/api/breed/${breed}/${subBreed}/images/random`;
                            opcion.textContent = `${breed} ${subBreed}`;
                            boton.appendChild(opcion);
                        });
                    }
                }
            })
        // Función para mostrar la imagen del perro seleccionado
        boton.addEventListener('change', () => {
            const url = boton.value;
            if (url) {
                fetch(url)
                    .then(respuesta => respuesta.json())
                    .then(perro => {
                        imagen.src = perro.message;
                        imagen.style.display = 'block';
                    })
            }
        });
    </script>>
</body>
</html>
