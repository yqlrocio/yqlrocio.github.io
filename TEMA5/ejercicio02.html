<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Exercises</title>
</head> 

<body>
    <h1>Ejercicio 2: Futbolero</h1>
    <select id="teamSelector">
        <option value="">Selecciona un equipo</option>
        <option value="Arsenal">Arsenal</option>
        <option value="Chelsea">Chelsea</option>
        <option value="Liverpool">Liverpool</option>
        <option value="Manchester United">Manchester United</option>
        <option value="Manchester City">Manchester City</option>
    </select>
    <div id="teamInfo" style="margin-top:20px;"></div>

    <script>
        const teamSelector = document.getElementById('teamSelector');
        const teamInfo = document.getElementById('teamInfo');

        teamSelector.addEventListener('change', () => {
            const teamName = teamSelector.value;
            if (teamName) {
                fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${teamName}`)
                    .then(response => response.json())
                    .then(data => {
                        const team = data.teams[0];
                        teamInfo.innerHTML = `
                            <h2>${team.strTeam}</h2>
                            <p><strong>Formed Year:</strong> ${team.intFormedYear}</p>
                            <p><strong>Stadium:</strong> ${team.strStadium}</p>
                            <p><strong>Description:</strong> ${team.strDescriptionEN}</p>
                        `;
                    })
            } else {
                teamInfo.innerHTML = '';
            }
        });
    </script>
</body>
</html>
