<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejercicio Json</title>
    </head>

    <body>
        // Libreria jQuery
        <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-0aV6G6prZf4v69dPq6tWXvBxKc0WQB62pzdZ30Ryrrao="
        crossorigin="anonymous">
        </script>

    // Contenedor para mostrar el mensaje
    <div id="contenedor"> Hola </div>

    // Formulario para introducir los datos
    <form action="">  
        <input type="text" id="inputNombre" name="nombre" placeholder="Nombre" > // EL NAME SE PUEDE OMITIR
        <input type="text" id="inputApellido" name="apellido" placeholder="Apellido" >
        <input type="number" id="inputEdad" name="edad" placeholder="Edad" >
        <input type="text" id="inputCiudad" name="ciudad" placeholder="Ciudad" >
        <button type="button" id="btnEnviar">ENVIAR</button>
    </form>

    <br>
    // Tabla para mostrar los datos
    <table border = "1">
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Edad</th>
            <th>Ciudad</th>
        </tr>
        <tr>
            <td id="nombre"></td>
            <td id="apellido"></td>
            <td id="edad"></td>
            <td id="ciudad"></td>
        </tr>
    </table>

        <script> 
        $(document).ready(function() { 

        // Mensaje objeto
        let obj = {nombre: "Alberto", apellido: "Ramos", edad: 26, ciudad: "Granada"};

        // Se realiza el envio 
        let obj_serializado = enviar(obj); 


        //
        /// Se realiza el envio y viaaja...
        //

        let obj_recuperado = recibir(obj_serializado);  // Se convierte en objeto
        insertaDatos(obj_recuperado);                   // Se inserta en la tabla
        });

            function serializar(obj) {
                return JSON.stringify(obj);
            }

            function deserializar(objJson) {
                return JSON.parse(objJson);
            }

            function enviar(obj) {
                console.log("Serializado:" + obj.nombre);
                return serializar(obj);
            }

            function recibir(json_serializado) {
                console.log("Deserializado: " + json_serializado);
                return deserializar(json_serializado);
            }

            function insertaDatos(obj_recuperado) {
            // Se inserta en la tabla de forma en json
            $("#nombre").text(obj_recuperado.nombre);
            $("#apellido").text(obj_recuperado.apellido);       
            $("#edad").text(obj_recuperado.edad);
            $("#ciudad").text(obj_recuperado.ciudad);    
           
            // Se inserta en la tabla de forma en html
            $("tr2").html (
                "<td>" + obj_recuperado.nombre + "</td>" +
                "<td>" + obj_recuperado.apellido + "</td>" +
                "<td>" + obj_recuperado.edad + "</td>" +
                "<td>" + obj_recuperado.ciudad + "</td>"
            );
        }
        </script>
    </body>
</html>
