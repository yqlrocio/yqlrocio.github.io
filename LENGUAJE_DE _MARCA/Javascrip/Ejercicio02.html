    <h2 id="titulo5">Apartado A: </h2>
        <script>
            const numAsignado = 7;
            if (numAsignado % 2 === 0) {
                document.write("El número es par");
            } else if (numAsignado % 2 !== 0) {
                document.write("El número es impar");
            } 
        </script>

    <h2 id="titulo6">Apartado B: </h2>
        <script>
            const edad = 20;
            if (edad >= 18) {
                document.write ("Eres mayor de edad y puedes votar");
            } else {
                document.write ("No eres mayor de edad y no puedes votar");
            }
        </script>
    
    <h2 id="titulo6">Apartado C: </h2>
