<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja Simple con CSS</title>

    <style>
        .container {
            width: 80%;
            height: 500px;
            margin: auto;
            padding: 20px; 
            background-color: antiquewhite;
            border: 10px double darkcyan;
            flex-direction: row-reverse;
            display: flex;
            justify-content: space-around;
        }
        .item1 {
           height: 100px;
            width: 100px;
            text-align: center;
            border: 1px solid gray;
            background-color: lightgray;
            align-items: center;
        }
        .item2 {
            height: 100px;
            width: 100px;
            text-align: center;
            border: 1px solid gray;
            background-color: lightgray;
            align-items: center;
        }
        .item3 {
            height: 100px;
            width: 100px;
            text-align: center;
            border: 1px solid gray;
            background-color: lightgray;
        }
    </style>
</head>

<body>
    <table>
        <tr>
                <div class="container">
                    <div class="item1">Elemento 1</div>
                    <div class="item2">Elemento 2</div>
                    <div class="item3">Elemento 3</div>
                </div>

            </td>
        </tr>
    </table>
</body>
</html>
