 <style>

    <h1 style="color: rgb(0, 0, 0); background-color: rgb(171, 191, 247); font-size: 30px"> Receta de la tortilla francesa</h1>

    <type="circle">

        <li>Aceite</li>

    <ol>
       <type="1">

    </type>  
    </ol>
