<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Formulario</title>
</head>
<body>
  <form action="https://lm.ciclo.iesnervion.es/form3/envio.php"  method="post" enctype="multipart/form-data"> 
  
    <fieldset>
       
      <legend>Formulario de contacto</legend>
      
      <label for="name">Nombre:</label>
      <input type="text" id="name" name="nombre"><br>
      
      <label for="email">Correo:</label>
      <input type="email" id="email" name="correo"><br>
    
      <label for="mensaje">Mensaje:</label>
      <textarea id="mensaje" name="mensaje"rows="5" cols="40" required></textarea><br><br>

      <label for="imagen">Subir imagen:</label><br>
      <input type="file" id="imagen" name="imagen" accept="image/*"><br><br>
    </fieldset>





    <button type="submit">Enviar</button>

    <p><a href="../index.html">← Volver a la página principal</a></p>

  </form>
</body>
