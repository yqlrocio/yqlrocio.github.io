
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title> FORMULARIO</title>
    <style>
        a {
            text-decoration: none;
            color: #0066cc;
        }
    </style> 
 </head>

 <header>
    <h1>CodeFest 2025</h1>
    <h2> "Donde la Música y el Código se encuentran"</h2>
   <link rel="stylesheet" href=".\css\estilos.css">
  </header>

  <body>
     <form action="https://www.w3schools.com/action_page.php"  method="post" enctype="multipart/form-data"> 

  <main>
    <fieldset>
       
      <legend>Datos personales:</legend>
      
      <label for="name">Nombre y appellidos:</label>
      <input type="text" placeholder="Nombre y Apellidos" name="nombre"><br>
      
      <label for="email" required >Correo:</label>
      <input type="email" id="email" name="correo"><br>
    
    </fieldset>

    <fieldset>
      
      <legend>Tipo de entrada:</legend>

      <input type="radio">
      <select>
      <option name="tipo_entrada">Abono General (3 Días)</option>
      <option name="tipo_entrada">Abono VIP (3 Días)</option>
      <option name="tipo_entrada">Entrada de Día</option>
      </select>

    </fieldset>

    <fieldset>
      
      <legend>Extras:</legend>

      <input type="checkbox">
      <select multiple>
      <option name="extra1">Camping</option>
      <option value="extra2">Pack Merchandising</option>
      <option value="extra3">Acceso a Talleres Tech</option>
      </select>
    
    </fieldset>

   <legend>Día (Solo si es Entrada de Día):</legend>

      <select>
      <option name="dia1">Viernes</option>
      <option name="dia2">Sábado</option>
      <option name="dia3">Domingo</option>
      </select>

    <button type="submit">Enviar</button>

    <p><a href="../index.html">← Volver a la página principal</a></p>

  </form>

  </main>

  </body>

  </html>
