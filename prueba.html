<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página con índice y contenido</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    /* Panel izquierdo */
    #indice {
      width: 25%;
      background-color: #1f2937;
      color: white;
      padding: 20px;
    }

    #indice h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #indice ul {
      list-style: none;
      padding: 0;
    }

    #indice li {
      margin: 10px 0;
      cursor: pointer;
      padding: 10px;
      border-radius: 8px;
      transition: background 0.3s;
    }

    #indice li:hover {
      background-color: #374151;
    }

    /* Panel derecho */
    #contenido {
      flex: 1;
      padding: 30px;
      background-color: #f9fafb;
      overflow-y: auto;
    }

    #contenido h2 {
      color: #111827;
    }
  </style>
</head>
<body>

  <div id="indice">
    <h2>Índice</h2>
    <ul>
      <li onclick="mostrarContenido('ejercicio01')">Ejercicio01</li>
      <li onclick="mostrarContenido('ejercicio02')">Ejercicio02</li>
      <li onclick="mostrarContenido('ejercicio03')">Ejercicio03</li>
      <li onclick="mostrarContenido('ejercicio04')">Ejercicio04</li>
    </ul>
  </div>

  <div id="contenido">
    <h2>Bienvenido a mi página web</h2>
    <p>Selecciona una opción del índice para ver el contenido.</p>
  </div>

  <script>
    function mostrarContenido(seccion) {
      const contenido = document.getElementById("contenido");
      let html = "";

      switch (seccion) {
        case "ejercicio01":
          html = `
          <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      padding: 40px;
    }
    h1 {
      color: #333;
    }
    p {
      margin-bottom: 20px;
    }
    img {
      width: 200px;
      display: block;
      margin: 20px 0;
    }
    ol {
      padding-left: 20px;
    }
  </style>
</head>
<body>
  <h1>Ejercicio 1: Sobre mí</h1>

  <p>Estoy en el Ciclo porque me apasiona la tecnología y quiero desarrollarme profesionalmente en el ámbito de la programación y desarrollo web.</p>

  <p>Hasta ahora, estoy disfrutando mucho el contenido del curso. Aunque hay retos, estoy motivado/a a seguir aprendiendo cada día. Espero adquirir las habilidades necesarias para trabajar en el mundo digital.</p>

  <img src="https://upload.wikimedia.org/wikipedia/en/9/9a/SpongeBob_SquarePants_character.svg" alt="Personaje animado con el que me identifico">

  <h2>Mis gustos en orden de preferencia</h2>
  <ol>
    <li>Programar</li>
    <li>Escuchar música</li>
    <li>Hacer deporte</li>
    <li>Pasar tiempo con mis amigos</li>
    <li>Jugar videojuegos</li>
  </ol>
</body>
</html>

</html>          `;
          break;

        case "ejercicio02":
          html = `
            <h2>Ejercicio02</h2>
            <p>Somos una empresa dedicada a crear soluciones web modernas, intuitivas y funcionales.</p>
          `;
          break;

        case "servicios":
          html = `
            <h2>Servicios</h2>
            <ul>
              <li>Diseño Web</li>
              <li>Desarrollo de Aplicaciones</li>
              <li>Optimización SEO</li>
            </ul>
          `;
          break;

        case "contacto":
          html = `
            <h2>Contacto</h2>
            <p>Puedes escribirnos a <a href="mailto:info@ejemplo.com">info@ejemplo.com</a></p>
          `;
          break;

        default:
          html = "<h2>Sección no encontrada</h2>";
      }

      contenido.innerHTML = html;
    }
  </script>

</body>
</html>
